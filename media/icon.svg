<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="tile"><rect x="24" y="24" width="464" height="464" rx="112"/></clipPath>

    <!-- Stronger light gradient base -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#CFE2FF"/>
      <stop offset="0.5" stop-color="#E6DBFF"/>
      <stop offset="1"   stop-color="#FFD9D2"/>
    </linearGradient>

    <!-- Punchier glows -->
    <radialGradient id="gBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2F7BFF" stop-opacity="0.62"/><stop offset="1" stop-color="#2F7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9B6BFF" stop-opacity="0.42"/><stop offset="1" stop-color="#9B6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF4A55" stop-opacity="0.42"/><stop offset="1" stop-color="#FF4A55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00C46A" stop-opacity="0.48"/><stop offset="1" stop-color="#00C46A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gYellow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB800" stop-opacity="0.58"/><stop offset="1" stop-color="#FFB800" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Lively logo gradient (16x16 space): hot red -> orange -> yellow -> green -> cyan -> blue -> violet -->
    <linearGradient id="gradLogo" gradientUnits="userSpaceOnUse" x1="1.5" y1="3" x2="15.5" y2="14">
      <stop offset="0"    stop-color="#FF3B5C"/>
      <stop offset="0.17" stop-color="#FF8A1F"/>
      <stop offset="0.34" stop-color="#FFC800"/>
      <stop offset="0.52" stop-color="#17D26B"/>
      <stop offset="0.70" stop-color="#14BFE8"/>
      <stop offset="0.86" stop-color="#2F7BFF"/>
      <stop offset="1"    stop-color="#7C4DFF"/>
    </linearGradient>

    <!-- Gloss: bright top-left, fading out -->
    <linearGradient id="gloss" gradientUnits="userSpaceOnUse" x1="2" y1="1" x2="12" y2="12">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Depth: slight darkening toward bottom-right -->
    <linearGradient id="depth" gradientUnits="userSpaceOnUse" x1="6" y1="4" x2="14" y2="16">
      <stop offset="0.45" stop-color="#1B2A8A" stop-opacity="0"/>
      <stop offset="1"    stop-color="#1B2A8A" stop-opacity="0.22"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2B2A8A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="440" cy="50"  r="250" fill="url(#gBlue)"/>
    <circle cx="470" cy="270" r="190" fill="url(#gViolet)"/>
    <circle cx="40"  cy="60"  r="210" fill="url(#gRed)"/>
    <circle cx="40"  cy="480" r="230" fill="url(#gGreen)"/>
    <circle cx="480" cy="490" r="220" fill="url(#gYellow)"/>
    <rect x="24" y="24" width="464" height="232" fill="url(#shine)"/>
  </g>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#BFCBEE" stroke-width="3"/>

  <!-- VS Code logo: gradient + gloss + depth layers -->
  <g filter="url(#softShadow)">
    <g transform="translate(120 120) scale(17.5)">
      <path fill="url(#gradLogo)" d="M15.434 1.72887L12.14 0.144875C12.002 0.078875 11.855 0.046875 11.709 0.046875C11.353 0.046875 11.18 0.211875 11.155 0.228875C11.073 0.270875 11.005 0.337875 11.004 0.338875L4.698 6.08888L1.951 4.00488C1.832 3.91388 1.69 3.86987 1.548 3.86987C1.387 3.86987 1.226 3.92788 1.1 4.04288L0.219 4.84387C0.074 4.97587 0.001 5.15688 0.001 5.33687C0.001 5.51687 0.073 5.69688 0.218 5.82888L2.6 8.00088L0.217 10.1719C0.072 10.3039 0 10.4839 0 10.6639C0 10.8439 0.073 11.0249 0.218 11.1569L1.099 11.9579C1.226 12.0729 1.386 12.1309 1.547 12.1309C1.688 12.1309 1.83 12.0859 1.95 11.9959L4.697 9.91187L11.003 15.6619C11.003 15.6619 11.072 15.7299 11.155 15.7719C11.179 15.7889 11.353 15.9529 11.709 15.9529C11.855 15.9529 12.003 15.9209 12.141 15.8549L15.435 14.2709C15.781 14.1049 16.001 13.7539 16.001 13.3699V2.62888C16.001 2.24487 15.781 1.89488 15.435 1.72787L15.434 1.72887ZM7.217 7.99988L12.002 4.36987V11.6299L7.217 7.99988Z"/>
      <path fill="url(#depth)"    d="M15.434 1.72887L12.14 0.144875C12.002 0.078875 11.855 0.046875 11.709 0.046875C11.353 0.046875 11.18 0.211875 11.155 0.228875C11.073 0.270875 11.005 0.337875 11.004 0.338875L4.698 6.08888L1.951 4.00488C1.832 3.91388 1.69 3.86987 1.548 3.86987C1.387 3.86987 1.226 3.92788 1.1 4.04288L0.219 4.84387C0.074 4.97587 0.001 5.15688 0.001 5.33687C0.001 5.51687 0.073 5.69688 0.218 5.82888L2.6 8.00088L0.217 10.1719C0.072 10.3039 0 10.4839 0 10.6639C0 10.8439 0.073 11.0249 0.218 11.1569L1.099 11.9579C1.226 12.0729 1.386 12.1309 1.547 12.1309C1.688 12.1309 1.83 12.0859 1.95 11.9959L4.697 9.91187L11.003 15.6619C11.003 15.6619 11.072 15.7299 11.155 15.7719C11.179 15.7889 11.353 15.9529 11.709 15.9529C11.855 15.9529 12.003 15.9209 12.141 15.8549L15.435 14.2709C15.781 14.1049 16.001 13.7539 16.001 13.3699V2.62888C16.001 2.24487 15.781 1.89488 15.435 1.72787L15.434 1.72887ZM7.217 7.99988L12.002 4.36987V11.6299L7.217 7.99988Z"/>
      <path fill="url(#gloss)"    d="M15.434 1.72887L12.14 0.144875C12.002 0.078875 11.855 0.046875 11.709 0.046875C11.353 0.046875 11.18 0.211875 11.155 0.228875C11.073 0.270875 11.005 0.337875 11.004 0.338875L4.698 6.08888L1.951 4.00488C1.832 3.91388 1.69 3.86987 1.548 3.86987C1.387 3.86987 1.226 3.92788 1.1 4.04288L0.219 4.84387C0.074 4.97587 0.001 5.15688 0.001 5.33687C0.001 5.51687 0.073 5.69688 0.218 5.82888L2.6 8.00088L0.217 10.1719C0.072 10.3039 0 10.4839 0 10.6639C0 10.8439 0.073 11.0249 0.218 11.1569L1.099 11.9579C1.226 12.0729 1.386 12.1309 1.547 12.1309C1.688 12.1309 1.83 12.0859 1.95 11.9959L4.697 9.91187L11.003 15.6619C11.003 15.6619 11.072 15.7299 11.155 15.7719C11.179 15.7889 11.353 15.9529 11.709 15.9529C11.855 15.9529 12.003 15.9209 12.141 15.8549L15.435 14.2709C15.781 14.1049 16.001 13.7539 16.001 13.3699V2.62888C16.001 2.24487 15.781 1.89488 15.435 1.72787L15.434 1.72887ZM7.217 7.99988L12.002 4.36987V11.6299L7.217 7.99988Z"/>
    </g>
  </g>
</svg>
