<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="tile"><rect x="24" y="24" width="464" height="464" rx="112"/></clipPath>

    <!-- Background: single smooth sweep through neighbouring hues (no clashing complementary blobs) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.000" stop-color="#AFDFFF"/>
      <stop offset="0.077" stop-color="#B5DEFE"/>
      <stop offset="0.154" stop-color="#C0DCFE"/>
      <stop offset="0.231" stop-color="#CADAFF"/>
      <stop offset="0.308" stop-color="#D4D9FE"/>
      <stop offset="0.385" stop-color="#D9D9FE"/>
      <stop offset="0.462" stop-color="#DDD9FF"/>
      <stop offset="0.538" stop-color="#E7D5FF"/>
      <stop offset="0.615" stop-color="#F9CDFF"/>
      <stop offset="0.692" stop-color="#FFCFF4"/>
      <stop offset="0.769" stop-color="#FED3ED"/>
      <stop offset="0.846" stop-color="#FFD8DE"/>
      <stop offset="0.923" stop-color="#FEDBD1"/>
      <stop offset="1.000" stop-color="#FFDDCA"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7CBDFF" stop-opacity="0.75"/><stop offset="1" stop-color="#7CBDFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FCA2DF" stop-opacity="0.65"/><stop offset="1" stop-color="#FCA2DF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPeach" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFCD94" stop-opacity="0.70"/><stop offset="1" stop-color="#FFCD94" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Logo gradient: Gemini colors, interpolated evenly (OKLCH) so transitions stay clean -->
    <linearGradient id="gradLogo" gradientUnits="userSpaceOnUse" x1="1.0" y1="2.5" x2="15.0" y2="13.5">
      <stop offset="0.0458" stop-color="#2481FF"/>
      <stop offset="0.1539" stop-color="#2980FF"/>
      <stop offset="0.2426" stop-color="#347DFF"/>
      <stop offset="0.2826" stop-color="#4179FF"/>
      <stop offset="0.3140" stop-color="#4E75FE"/>
      <stop offset="0.3370" stop-color="#5A6FFF"/>
      <stop offset="0.3562" stop-color="#6568FF"/>
      <stop offset="0.3732" stop-color="#6E62FE"/>
      <stop offset="0.3905" stop-color="#765BFE"/>
      <stop offset="0.4090" stop-color="#7C54FE"/>
      <stop offset="0.4291" stop-color="#804EFF"/>
      <stop offset="0.4493" stop-color="#814CFF"/>
      <stop offset="0.4695" stop-color="#8549FE"/>
      <stop offset="0.4912" stop-color="#8E45F9"/>
      <stop offset="0.5162" stop-color="#9B41F2"/>
      <stop offset="0.5461" stop-color="#AA3FE8"/>
      <stop offset="0.5792" stop-color="#BA3EDD"/>
      <stop offset="0.6090" stop-color="#C93ECF"/>
      <stop offset="0.6362" stop-color="#D640C2"/>
      <stop offset="0.6620" stop-color="#E042B6"/>
      <stop offset="0.6873" stop-color="#E844AC"/>
      <stop offset="0.7126" stop-color="#EC46A6"/>
      <stop offset="0.7377" stop-color="#ED46A4"/>
      <stop offset="0.7627" stop-color="#F1489F"/>
      <stop offset="0.7876" stop-color="#F74C95"/>
      <stop offset="0.8126" stop-color="#FF5287"/>
      <stop offset="0.8387" stop-color="#FE637B"/>
      <stop offset="0.8665" stop-color="#FF716F"/>
      <stop offset="0.8963" stop-color="#FE7E67"/>
      <stop offset="0.9289" stop-color="#FF8760"/>
      <stop offset="0.9676" stop-color="#FF8C5B"/>
      <stop offset="1.0506" stop-color="#FF8F5A"/>
    </linearGradient>

    <linearGradient id="gloss" gradientUnits="userSpaceOnUse" x1="2" y1="1" x2="11" y2="10">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#3A3A9A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="450" cy="40"  r="240" fill="url(#glowBlue)"/>
    <circle cx="40"  cy="470" r="230" fill="url(#glowPink)"/>
    <circle cx="470" cy="480" r="210" fill="url(#glowPeach)"/>
    <rect x="24" y="24" width="464" height="232" fill="url(#shine)"/>
  </g>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3"/>

  <!-- VS Code logo -->
  <g filter="url(#softShadow)">
